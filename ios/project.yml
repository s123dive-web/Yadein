# XcodeGen spec for the iPhone app. Generate the Xcode project with `xcodegen generate` (CI does this); the
# .xcodeproj is not committed. Fonts and music are taken straight from the Android module folders so both apps
# always ship the same files.
name: Yaadein
options:
  bundleIdPrefix: com.yaadein
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  YaadeinKit:
    path: YaadeinKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Yaadein:
    type: application
    platform: iOS
    sources:
      - path: Yaadein
      - path: Shared
      - path: ../core/ui/src/main/res/font
        buildPhase: resources
      - path: ../feature/recap/src/main/res/raw
        buildPhase: resources
    entitlements:
      path: Yaadein/Yaadein.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yaadein.app]
    dependencies:
      - target: YaadeinWidget
      - target: YaadeinShare
      - package: YaadeinKit
        product: YaadeinDomain
      - package: YaadeinKit
        product: YaadeinCrypto
      - package: YaadeinKit
        product: YaadeinData
    info:
      path: Yaadein/Info.plist
      properties:
        CFBundleDisplayName: Yaadein
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, hi, mr, gu, ta, te, bn, kn]
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts:
          - fraunces_regular.ttf
          - fraunces_medium.ttf
          - fraunces_semibold.ttf
          - fraunces_semibold_italic.ttf
          - fraunces_bold.ttf
          - manrope_regular.ttf
          - manrope_medium.ttf
          - manrope_semibold.ttf
          - manrope_bold.ttf
        NSFaceIDUsageDescription: Face ID opens Yaadein instead of typing your PIN. Your face never leaves the phone.
        NSCameraUsageDescription: Take a photo or video straight into a memory.
        NSMicrophoneUsageDescription: Record a voice memory. Audio is recorded only while you hold record and stays on this phone.
        # Standard encryption of the user's own data at rest only (exempt).
        ITSAppUsesNonExemptEncryption: false
        # Widget links: yaadein://quick, yaadein://memory/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: com.yaadein.app
            CFBundleURLSchemes: [yaadein]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yaadein.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Home-screen widget (RemindersWidget on Android). Shows only what the app wrote to the App Group.
  YaadeinWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: YaadeinWidget
      - path: Shared
      - path: Yaadein/Resources
        buildPhase: resources
      - path: ../core/ui/src/main/res/font
        buildPhase: resources
    entitlements:
      path: YaadeinWidget/YaadeinWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yaadein.app]
    info:
      path: YaadeinWidget/Info.plist
      properties:
        CFBundleDisplayName: Yaadein
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, hi, mr, gu, ta, te, bn, kn]
        UIAppFonts: [fraunces_semibold.ttf, manrope_medium.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yaadein.app.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # Share → Save to Yaadein (SEND / SEND_MULTIPLE on Android). Copies files into the App Group inbox only.
  YaadeinShare:
    type: app-extension
    platform: iOS
    sources:
      - path: YaadeinShare
      - path: Shared
      - path: Yaadein/Resources
        buildPhase: resources
      - path: ../core/ui/src/main/res/font
        buildPhase: resources
    entitlements:
      path: YaadeinShare/YaadeinShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yaadein.app]
    info:
      path: YaadeinShare/Info.plist
      properties:
        CFBundleDisplayName: Save to Yaadein
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, hi, mr, gu, ta, te, bn, kn]
        UIAppFonts: [fraunces_semibold.ttf, manrope_regular.ttf, manrope_semibold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yaadein.app.share
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  YaadeinTests:
    type: bundle.unit-test
    platform: iOS
    sources: [YaadeinTests]
    dependencies:
      - target: Yaadein
      - package: YaadeinKit
        product: YaadeinCrypto
      - package: YaadeinKit
        product: YaadeinData
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Yaadein:
    build:
      targets:
        Yaadein: all
        YaadeinTests: [test]
    test:
      targets: [YaadeinTests]
