name: Device tests and performance

# Runs the on-device tests (real Keystore, SQLCipher, Argon2, Media3 Transformer) on an Android emulator, measures cold
# start against the budget in docs/PERFORMANCE.md, and records a baseline profile. Separate from "Build APK" so a slow
# or flaky emulator never blocks an APK.
on:
  workflow_dispatch:
  push:
    branches: [main, 'ccr-*']
    paths:
      - 'core/data/**'
      - 'feature/recap/**'
      - 'app/**'
      - 'benchmark/**'
      - '.github/workflows/device-tests.yml'

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew :core:data:assembleDebugAndroidTest :feature:recap:assembleDebugAndroidTest :benchmark:assembleBenchmark :app:assembleBenchmark --no-daemon
      - name: On-device tests, startup benchmark and baseline profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            ./gradlew :core:data:connectedDebugAndroidTest --no-daemon
            ./gradlew :feature:recap:connectedDebugAndroidTest --no-daemon || echo "::warning::reel rendering test failed (slow emulator?)"
            ./gradlew :benchmark:connectedBenchmarkAndroidTest --no-daemon
      - name: Check the startup budget
        run: |
          python3 - <<'PY'
          import glob, json, sys
          budget_ms = 2000  # docs/PERFORMANCE.md: measured CI-emulator median ~1.7 s (Nov 2026) + headroom; a regression guard
          files = glob.glob('benchmark/build/outputs/connected_android_test_additional_output/**/*benchmarkData.json', recursive=True)
          if not files:
              print('::warning::no benchmark results found'); sys.exit(0)
          data = json.load(open(files[0]))
          for b in data['benchmarks']:
              m = b['metrics'].get('timeToInitialDisplayMs')
              if m: print(f"{b['name']}: median {m['median']:.0f} ms (min {m['minimum']:.0f}, max {m['maximum']:.0f})")
          profiled = next((b for b in data['benchmarks'] if b['name'] == 'coldStartWithProfile'), None)
          if profiled and profiled['metrics']['timeToInitialDisplayMs']['median'] > budget_ms:
              print(f"::error::cold start median over the {budget_ms} ms budget"); sys.exit(1)
          PY
      - name: Upload test reports, benchmark results and baseline profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-results
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            benchmark/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: ignore
