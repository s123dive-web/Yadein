name: iOS

# The iPhone app lives in ios/. This workflow never touches the Android build: build.yml, device-tests.yml and
# release.yml are unchanged and keep producing the APK on every push.
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      # Strings, fonts and music are shared with Android; a change there must still produce the same iOS files.
      - '**/src/main/res/values*/strings.xml'
      - 'core/ui/src/main/kotlin/com/yaadein/core/ui/theme/Color.kt'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - '**/src/main/res/values*/strings.xml'
      - 'core/ui/src/main/kotlin/com/yaadein/core/ui/theme/Color.kt'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Strings and palettes are generated from the Android sources; fail if someone edited one side only.
  shared-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: iOS strings and colours match Android
        run: python3 ios/scripts/sync_from_android.py --check

  # Pure Swift logic (ported from core:domain) and crypto, on Linux: fast and cheap, no Mac needed.
  kit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Domain and crypto tests (debug)
        working-directory: ios/YaadeinKit
        run: swift test
      - name: Argon2id with Android's real parameters (release)
        working-directory: ios/YaadeinKit
        env:
          YAADEIN_SLOW_TESTS: '1'
        run: swift test -c release -Xswiftc -enable-testing --filter Argon2

  # The app itself: generate the Xcode project, build, test on a simulator, launch once for a screenshot, then build
  # an installable package for real iPhones and attach everything to a GitHub release "ios-build-<run>".
  # Builds are unsigned unless the Apple secrets exist (see the testflight job and docs/IOS.md).
  app:
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      # Same numbering idea as the APK: build number = commit count, version 0.1.<count>.
      DERIVED: build/DerivedData
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versions
        id: ver
        run: |
          xcodebuild -version
          COUNT=$(git rev-list --count HEAD)
          echo "build=$COUNT" >> "$GITHUB_OUTPUT"
          echo "version=0.1.$COUNT" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if 'iOS' in k), reverse=True)
          for r in runtimes:
              for d in devices[r]:
                  if d['name'].startswith('iPhone'):
                      print(d['udid']); sys.exit(0)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Build for the simulator
        working-directory: ios
        timeout-minutes: 30
        run: |
          set +e
          mkdir -p build
          xcodebuild build-for-testing -project Yaadein.xcodeproj -scheme Yaadein \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$DERIVED" \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO > build/build.log 2>&1
          status=$?
          grep -E "error:|\*\* (BUILD|TEST)" build/build.log | tail -100
          if [ $status -ne 0 ]; then grep -E "error:" -A3 build/build.log | head -200; fi
          exit $status
      - name: App tests
        working-directory: ios
        timeout-minutes: 20
        # A stuck simulator must not stop the iPhone build below; failures still show in red on this step.
        continue-on-error: true
        run: |
          set +e
          xcodebuild test -project Yaadein.xcodeproj -scheme Yaadein \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO > build/test.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* TEST" build/test.log | tail -100
          exit $status
      - name: Launch screenshot
        timeout-minutes: 5
        continue-on-error: true
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          mkdir -p ios/build/out
          APP=$(find ios/build/DerivedData/Build/Products -name "Yaadein.app" -path "*iphonesimulator*" | head -1)
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/ios/build/out/Yaadein-v${{ steps.ver.outputs.version }}-simulator.zip" Yaadein.app) || true
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.yaadein.app
          sleep 10
          xcrun simctl io "$UDID" screenshot ios/build/out/launch.png
      - name: Build for iPhone (unsigned .ipa)
        working-directory: ios
        timeout-minutes: 30
        run: |
          set +e
          xcodebuild archive -project Yaadein.xcodeproj -scheme Yaadein -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Yaadein.xcarchive \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build/archive.log 2>&1
          status=$?
          grep -E "error:|\*\* ARCHIVE" build/archive.log | tail -50
          [ $status -ne 0 ] && exit $status
          mkdir -p build/ipa/Payload build/out
          cp -R build/Yaadein.xcarchive/Products/Applications/Yaadein.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../out/Yaadein-v${{ steps.ver.outputs.version }}-unsigned.ipa" Payload)
          ls -la build/out
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yaadein-ios-${{ steps.ver.outputs.version }}
          path: |
            ios/build/out
            ios/build/*.log
          if-no-files-found: ignore
      # Only main publishes iOS releases.
      - name: Attach to a release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: iOS build ${{ github.run_number }} (v${{ steps.ver.outputs.version }})
          body: |
            iPhone app built from ${{ github.sha }}.
            - `Yaadein-v*-unsigned.ipa`: install on your own iPhone with a signing tool (AltStore, Sideloadly or Xcode
              with your Apple ID); for family and friends use TestFlight (add the Apple secrets, see docs/IOS.md).
            - `Yaadein-v*-simulator.zip`: runs in the Xcode iPhone simulator.
            - `launch.png`: the first screen, as launched on the simulator.
          files: |
            ios/build/out/*.ipa
            ios/build/out/*.zip
            ios/build/out/launch.png

  # Signed build to TestFlight, only when the owner has added the Apple secrets (docs/IOS.md, "Installing on an iPhone").
  testflight:
    needs: app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_APPLE: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Skip when the Apple secrets are missing
        if: env.HAS_APPLE != 'true'
        run: echo "No Apple secrets yet; the unsigned .ipa is on the release. See docs/IOS.md to enable TestFlight."
      - uses: actions/checkout@v4
        if: env.HAS_APPLE == 'true'
        with:
          fetch-depth: 0
      - name: Archive, sign and upload to TestFlight
        if: env.HAS_APPLE == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          brew install xcodegen
          cd ios && xcodegen generate
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$KEY"
          COUNT=$(git rev-list --count HEAD)
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project Yaadein.xcodeproj -scheme Yaadein -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Yaadein.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=0.1.$COUNT CURRENT_PROJECT_VERSION=$COUNT "${AUTH[@]}" | tail -20
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Yaadein.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}" | tail -20
