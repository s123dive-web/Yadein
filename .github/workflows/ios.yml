name: iOS

# The iPhone app lives in ios/. This workflow never touches the Android build: build.yml, device-tests.yml and
# release.yml are unchanged and keep producing the APK on every push.
on:
  push:
    branches: [main, 'ccr-*']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      # Strings, fonts and music are shared with Android; a change there must still produce the same iOS files.
      - '**/src/main/res/values*/strings.xml'
      - 'core/ui/src/main/kotlin/com/yaadein/core/ui/theme/Color.kt'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Strings and palettes are generated from the Android sources; fail if someone edited one side only.
  shared-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: iOS strings and colours match Android
        run: python3 ios/scripts/sync_from_android.py --check

  # Pure Swift logic (ported from core:domain) and crypto, on Linux: fast and cheap, no Mac needed.
  kit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Domain and crypto tests (debug)
        working-directory: ios/YaadeinKit
        run: swift test
      - name: Argon2id with Android's real parameters (release)
        working-directory: ios/YaadeinKit
        env:
          YAADEIN_SLOW_TESTS: '1'
        run: swift test -c release -Xswiftc -enable-testing --filter Argon2

  # The app itself: generate the Xcode project, build for the simulator, run the app tests, launch it once and keep a
  # screenshot. Unsigned (CODE_SIGNING_ALLOWED=NO): signing for real iPhones needs the owner's Apple account
  # (see docs/IOS.md).
  app:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if 'iOS' in k), reverse=True)
          for r in runtimes:
              for d in devices[r]:
                  if d['name'].startswith('iPhone'):
                      print(d['udid']); sys.exit(0)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Build and test
        working-directory: ios
        run: |
          set +e
          mkdir -p build
          xcodebuild test -project Yaadein.xcodeproj -scheme Yaadein \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO > build/xcodebuild.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* (BUILD|TEST)" build/xcodebuild.log | tail -150
          exit $status
      - name: Show compiler errors
        if: failure()
        working-directory: ios
        run: grep -E "error:" -A3 build/xcodebuild.log | head -200 || true
      - name: Launch screenshot
        if: success()
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find ios/build/DerivedData/Build/Products -name "Yaadein.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.yaadein.app
          sleep 8
          mkdir -p ios/build/screenshots
          xcrun simctl io "$UDID" screenshot ios/build/screenshots/launch.png
      - name: Upload simulator app and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yaadein-ios-simulator
          path: |
            ios/build/screenshots
            ios/build/xcodebuild.log
          if-no-files-found: ignore
