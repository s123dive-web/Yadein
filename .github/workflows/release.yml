name: Release AAB (signed)

# Manual only. Requires repository secrets:
#   KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name shown on Play (e.g. 1.0.0)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: versionCode is the commit count
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace
      - name: Build signed release AAB and APK
        env:
          YAADEIN_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          YAADEIN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YAADEIN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YAADEIN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace
      - name: Rename bundle
        run: mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/Yaadein-release.aab
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Yaadein-release-aab
          path: app/build/outputs/bundle/release/Yaadein-release.aab
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Yaadein-release-apk
          path: app/build/outputs/apk/release/Yaadein-*.apk
