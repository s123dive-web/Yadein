org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
android.nonTransitiveRClass=true
android.experimental.enableScreenshotTest=true
kotlin.code.style=official
# Retry transient repository errors (429/5xx) instead of failing the build.
systemProp.org.gradle.internal.repository.max.tentatives=12
systemProp.org.gradle.internal.repository.initial.backoff=3000
# KSP incremental processing occasionally failed to resolve types from other modules on CI after a cache restore
# ("PersonRepository could not be resolved"); full processing is a few seconds slower and always correct.
ksp.incremental=false
